<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sysml-bridge dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f13; color: #e2e8f0; min-height: 100vh; }

    header { padding: 20px 32px; border-bottom: 1px solid #1e2030; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; color: #f8fafc; }
    header span { font-size: 12px; color: #64748b; font-family: monospace; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    .status-dot.offline { background: #ef4444; }

    .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 61px); }

    .sidebar { border-right: 1px solid #1e2030; padding: 20px 0; }
    .sidebar-section { padding: 0 16px 16px; }
    .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #475569; text-transform: uppercase; padding: 0 8px 8px; }
    .project-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #94a3b8; display: flex; align-items: center; justify-content: space-between; }
    .project-item:hover { background: #1e2030; color: #e2e8f0; }
    .project-item.active { background: #1e2030; color: #f8fafc; }
    .project-item .badge { font-size: 10px; background: #1e3a5f; color: #60a5fa; padding: 2px 6px; border-radius: 99px; }

    .main { padding: 28px 32px; }
    .main-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #475569; font-size: 14px; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .stat-card { background: #161622; border: 1px solid #1e2030; border-radius: 8px; padding: 16px; }
    .stat-card .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #f8fafc; font-variant-numeric: tabular-nums; }
    .stat-card .sub { font-size: 11px; color: #475569; margin-top: 4px; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .section-title { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b; margin-bottom: 14px; }

    .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 28px; }
    .type-chip { background: #161622; border: 1px solid #1e2030; border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .type-chip .name { color: #94a3b8; }
    .type-chip .count { color: #60a5fa; font-weight: 700; font-family: monospace; }

    .diagram-box { background: #161622; border: 1px solid #1e2030; border-radius: 8px; padding: 24px; margin-bottom: 28px; }
    .diagram-box .mermaid { display: flex; justify-content: center; }
    .diagram-toggle { display: flex; gap: 4px; margin-bottom: 16px; }
    .diagram-toggle button { padding: 4px 10px; border-radius: 4px; border: 1px solid #1e2030; background: transparent; color: #64748b; font-size: 11px; cursor: pointer; }
    .diagram-toggle button.active { background: #1e3a5f; color: #60a5fa; border-color: #1e4a7f; }
    .diagram-loading { color: #475569; font-size: 13px; padding: 32px 0; text-align: center; }

    .element-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .element-table th { text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #475569; border-bottom: 1px solid #1e2030; }
    .element-table td { padding: 7px 12px; border-bottom: 1px solid #161622; color: #94a3b8; }
    .element-table tr:hover td { background: #161622; }
    .element-table td.type { color: #818cf8; font-family: monospace; font-size: 11px; }
    .element-table td.name { color: #e2e8f0; }
    .element-table td.id { color: #334155; font-family: monospace; font-size: 10px; }
    .table-box { background: #0f0f13; border: 1px solid #1e2030; border-radius: 8px; overflow: hidden; }

    .error-banner { background: #2d1b1b; border: 1px solid #7f1d1d; border-radius: 6px; padding: 12px 16px; color: #fca5a5; font-size: 12px; margin-bottom: 20px; }
    .refresh-btn { margin-left: auto; padding: 4px 12px; border-radius: 4px; border: 1px solid #1e2030; background: transparent; color: #64748b; font-size: 11px; cursor: pointer; }
    .refresh-btn:hover { color: #e2e8f0; border-color: #334155; }
  </style>
</head>
<body>

<header>
  <div id="status-dot" class="status-dot offline"></div>
  <h1>sysml-bridge</h1>
  <span id="api-url">localhost:9000</span>
  <button class="refresh-btn" onclick="init()">↻ refresh</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Projects</div>
      <div id="project-list"><div style="padding:8px 12px;font-size:12px;color:#334155">loading…</div></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty">Select a project to view its model</div>
  </main>
</div>

<script>
  const API = 'http://localhost:9000';
  let currentProject = null;
  let allElements = [];

  mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { background: '#161622', primaryColor: '#1e2030', primaryTextColor: '#e2e8f0', lineColor: '#475569', fontSize: '13px' } });

  async function apiFetch(path) {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  async function init() {
    try {
      const projects = await apiFetch('/projects');
      document.getElementById('status-dot').className = 'status-dot';

      const list = document.getElementById('project-list');
      if (!projects.length) { list.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:#334155">No projects yet</div>'; return; }

      list.innerHTML = projects.map(p =>
        `<div class="project-item" onclick="loadProject('${p['@id']}', this)">${p.name}</div>`
      ).join('');

      if (currentProject) {
        const el = [...list.querySelectorAll('.project-item')].find(e => e.textContent === currentProject.name);
        if (el) loadProject(currentProject['@id'], el);
      }
    } catch(e) {
      document.getElementById('status-dot').className = 'status-dot offline';
      document.getElementById('project-list').innerHTML = '<div style="padding:8px 12px;font-size:12px;color:#ef4444">API offline</div>';
    }
  }

  async function loadProject(id, el) {
    document.querySelectorAll('.project-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');

    const main = document.getElementById('main');
    main.innerHTML = '<div class="main-empty">Loading…</div>';

    try {
      const project = await apiFetch(`/projects/${id}`);
      currentProject = project;

      // Get latest commit
      const commits = await apiFetch(`/projects/${id}/commits`);
      if (!commits.length) {
        main.innerHTML = '<div class="main-empty">No commits yet</div>';
        return;
      }

      const commitId = commits[0]['@id'];
      const branchId = project.defaultBranch?.['@id'] ?? '';

      // Query all elements via POST query
      const qRes = await fetch(`${API}/projects/${id}/query-results?commitId=${commitId}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({'@type':'Query'})
      });
      allElements = qRes.ok ? await qRes.json() : [];

      renderProject(project, commitId, branchId, allElements);
    } catch(e) {
      main.innerHTML = `<div class="error-banner">Failed to load project: ${e.message}</div>`;
    }
  }

  function renderProject(project, commitId, branchId, elements) {
    const counts = {};
    for (const el of elements) counts[el['@type']] = (counts[el['@type']] ?? 0) + 1;

    const partDefs = elements.filter(e => e['@type'] === 'PartDefinition');
    const reqDefs  = elements.filter(e => e['@type'] === 'RequirementDefinition');

    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="stats-row">
        <div class="stat-card">
          <div class="label">Total Elements</div>
          <div class="value">${elements.length}</div>
          <div class="sub">${commitId.slice(0,8)}…</div>
        </div>
        <div class="stat-card">
          <div class="label">Part Defs</div>
          <div class="value">${partDefs.length}</div>
          <div class="sub">PartDefinition</div>
        </div>
        <div class="stat-card">
          <div class="label">Requirements</div>
          <div class="value">${reqDefs.length}</div>
          <div class="sub">RequirementDefinition</div>
        </div>
        <div class="stat-card">
          <div class="label">Types</div>
          <div class="value">${Object.keys(counts).length}</div>
          <div class="sub">distinct</div>
        </div>
      </div>

      <div class="section-title">Element Types</div>
      <div class="type-grid">${
        Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([type, count]) =>
          `<div class="type-chip"><span class="name">${type}</span><span class="count">${count}</span></div>`
        ).join('')
      }</div>

      <div class="section-title">BDD Diagram</div>
      <div class="diagram-box">
        <div id="diagram-render" class="diagram-loading">Generating diagram…</div>
      </div>

      <div class="section-title">All Elements</div>
      <div class="table-box">
        <table class="element-table">
          <thead><tr><th>Name</th><th>Type</th><th>ID</th></tr></thead>
          <tbody>${
            elements.map(e =>
              `<tr>
                <td class="name">${e.declaredName ?? e.name ?? '<unnamed>'}</td>
                <td class="type">${e['@type']}</td>
                <td class="id">${e['@id']}</td>
              </tr>`
            ).join('')
          }</tbody>
        </table>
      </div>
    `;

    renderBDD(partDefs, reqDefs);
  }

  async function renderBDD(partDefs, reqDefs) {
    const box = document.getElementById('diagram-render');
    if (!partDefs.length && !reqDefs.length) { box.textContent = 'No elements to diagram'; return; }

    const lines = ['classDiagram'];
    for (const p of partDefs) {
      const name = (p.declaredName ?? p.name ?? p['@id']).replace(/\s+/g, '_');
      lines.push(`    class ${name} {\n        <<part def>>\n    }`);
    }
    for (const r of reqDefs) {
      const name = (r.declaredName ?? r.name ?? r['@id']).replace(/\s+/g, '_');
      const short = r.declaredShortName ? `\\n${r.declaredShortName}` : '';
      lines.push(`    class ${name} {\n        <<requirement def>>${short}\n    }`);
    }

    const mmdCode = lines.join('\n');
    try {
      const id = 'bdd-' + Date.now();
      const { svg } = await mermaid.render(id, mmdCode);
      box.innerHTML = svg;
    } catch(e) {
      box.textContent = 'Diagram render failed: ' + e.message;
    }
  }

  init();
  setInterval(init, 15000);
</script>
</body>
</html>
