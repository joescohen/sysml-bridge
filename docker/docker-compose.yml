services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=sysml2
    ports:
      - "5432:5432"
    volumes:
      - sysml-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  sysml-api:
    image: mbsemashup/sysmlv2-api.pilotimpl:latest
    platform: linux/amd64
    tty: false
    environment:
      - HIBERNATE_SHOW_SQL=false
      - HIBERNATE_HBM2DDL=update
      - JDBC_DRIVER=org.postgresql.Driver
      - HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - JDBC_URL=jdbc:postgresql://db:5432/sysml2
      - JDBC_USER=postgres
      - JDBC_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "9000:9000"
    restart: always
    depends_on:
      db:
        condition: service_healthy

  syson:
    image: eclipsesyndesisio/syson:latest
    platform: linux/amd64
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/sysml2
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  sysml-data:
