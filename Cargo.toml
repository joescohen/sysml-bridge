[workspace]
resolver = "2"
members = ["crates/sysml-core", "crates/sysml-server", "crates/sysml-conform", "crates/sysml-check"]
# The viewer is a separate crate with its own lock file and toolchain.
exclude = ["tools/viewer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
